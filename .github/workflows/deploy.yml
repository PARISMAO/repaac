name: Deploy REPAAC to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets (API Key + Users)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPAAC_USERS: ${{ secrets.REPAAC_USERS }}
        run: |
          python3 -c "
          import os, sys
          with open('index.html', 'r', encoding='utf-8') as f:
              c = f.read()
          k = os.environ.get('ANTHROPIC_API_KEY', '')
          u = os.environ.get('REPAAC_USERS', '')
          if k and k.startswith('sk-'):
              c = c.replace('__ANTHROPIC_API_KEY__', k)
          if u and u != '__REPAAC_USERS__':
              c = c.replace('__REPAAC_USERS__', u)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(c)
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
