name: Deploy REPAAC to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets (API Key + Users)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPAAC_USERS: ${{ secrets.REPAAC_USERS }}
        run: |
          python3 - << 'PYEOF'
          import os
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          api_key = os.environ.get('ANTHROPIC_API_KEY', '')
          users = os.environ.get('REPAAC_USERS', '')
          if api_key and api_key.startswith('sk-'):
              content = content.replace('__ANTHROPIC_API_KEY__', api_key)
          if users and users != '__REPAAC_USERS__':
              content = content.replace('__REPAAC_USERS__', users)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
